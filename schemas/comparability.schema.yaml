$schema: https://json-schema.org/draft/2020-12/schema
title: Awesome-MVOD comparability rules
type: object
required: [version, statuses, required_factors, rules, track_matrix, leaderboard_policy]
additionalProperties: false
properties:
  version:
    type: string
    pattern: '^0\.3\.0$'
  statuses:
    type: array
    uniqueItems: true
    minItems: 4
    maxItems: 4
    items:
      enum: [DIRECTLY_COMPARABLE, CONDITIONALLY_COMPARABLE, NOT_DIRECTLY_COMPARABLE, UNKNOWN]
  required_factors:
    type: array
    uniqueItems: true
    minItems: 1
    items: {type: string, minLength: 2}
  rules:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, priority, when, result, rationale]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        priority: {type: integer, minimum: 1}
        when: {type: string, minLength: 5}
        result:
          enum: [DIRECTLY_COMPARABLE, CONDITIONALLY_COMPARABLE, NOT_DIRECTLY_COMPARABLE, UNKNOWN]
        rationale: {type: string, minLength: 10}
  track_matrix:
    type: object
    minProperties: 3
    additionalProperties:
      type: object
      minProperties: 3
      additionalProperties:
        enum: [DIRECTLY_COMPARABLE, CONDITIONALLY_COMPARABLE, NOT_DIRECTLY_COMPARABLE, UNKNOWN]
  leaderboard_policy:
    type: object
    required: [allow_only_when, otherwise, warning]
    additionalProperties: false
    properties:
      allow_only_when: {type: string, minLength: 5}
      otherwise: {type: string, minLength: 5}
      warning: {type: string, minLength: 10}

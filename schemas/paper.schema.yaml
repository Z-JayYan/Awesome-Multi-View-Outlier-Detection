$schema: https://json-schema.org/draft/2020-12/schema
title: Awesome-MVOD paper entry
type: object
required:
  - id
  - title
  - year
  - venue
  - venue_type
  - venue_status
  - track
  - view_setting
  - training_paradigm
  - status
  - featured
  - tasks
  - mechanisms
  - anomaly_types
  - evidence_levels
  - partial_view
  - datasets
  - summary
  - links
  - code_status
  - link_status
  - verified_from
  - reproducibility
  - protocol
additionalProperties: false
properties:
  id:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]{4}$'
  title:
    type: string
    minLength: 8
  acronym:
    type: [string, 'null']
  authors:
    type: array
    items: {type: string}
  year:
    type: integer
    minimum: 2000
    maximum: 2100
  online_year:
    type: [integer, 'null']
  venue:
    type: string
  venue_type:
    enum: [conference, journal, workshop, preprint, book_chapter]
  venue_status:
    enum: [proceedings, published, accepted, preprint]
  track:
    enum: [core_mvod, partial_mvod, related_natural_multimodal, uncertain]
  view_setting:
    enum: [complete, incomplete, partial, industrial, unknown]
  training_paradigm:
    enum: [unsupervised, semi_supervised, normal_only, online, transductive, unknown]
  status:
    enum: [verified, partially_verified, uncertain]
  featured:
    type: boolean
  tasks:
    type: array
    minItems: 1
    items: {type: string}
  mechanisms:
    type: array
    minItems: 1
    items: {type: string}
  anomaly_types:
    type: array
    minItems: 1
    items: {type: string}
  evidence_levels:
    type: array
    minItems: 1
    items: {type: string}
  representation:
    type: object
    properties:
      learned: {type: boolean}
    required: [learned]
    additionalProperties: false
  partial_view:
    type: boolean
  datasets:
    type: array
    items: {type: string}
  summary:
    type: string
    description: One sentence answering which cross-view signal is used.
  links:
    type: object
    required: [paper, code]
    properties:
      paper: {type: string, format: uri}
      arxiv: {type: [string, 'null'], format: uri}
      code: {type: [string, 'null'], format: uri}
      project: {type: [string, 'null'], format: uri}
      dblp: {type: [string, 'null'], format: uri}
    additionalProperties: false
  code_status:
    enum: [official, third_party, not_found, unknown]
  link_status:
    enum: [verified, unverified]
  verified_from:
    type: array
    minItems: 1
    items:
      type: object
      required: [kind, url]
      properties:
        kind: {enum: [publisher, conference, arxiv, dblp, official_code, author_page]}
        url: {type: string, format: uri}
        facts:
          type: array
          items: {type: string}
      additionalProperties: false
  complexity:
    type: object
    properties:
      reported: {type: [string, 'null']}
      provenance: {enum: [author_claim, derived, unknown]}
      notes: {type: [string, 'null']}
    required: [reported, provenance, notes]
    additionalProperties: false
  reproducibility:
    type: object
    required: [official_code, official_config, dataset_instructions, pretrained_weights, environment, license]
    properties:
      official_code: {enum: ['yes', 'no', partial, unknown]}
      official_config: {enum: ['yes', 'no', partial, unknown]}
      dataset_instructions: {enum: ['yes', 'no', partial, unknown]}
      pretrained_weights: {enum: ['yes', 'no', partial, unknown]}
      environment: {enum: ['yes', 'no', partial, unknown]}
      license: {enum: ['yes', 'no', partial, unknown]}
    additionalProperties: false
  protocol:
    type: object
    required: [view_setting, anomaly_types, anomaly_generation, contamination, preprocessing, evaluation, data_setting, verification]
    additionalProperties: false
    properties:
      view_setting:
        type: object
        required: [type]
        additionalProperties: false
        properties:
          type: {enum: [complete, incomplete, partial, industrial, unknown]}
      anomaly_types:
        type: array
        minItems: 1
        items: {type: string}
      anomaly_generation:
        type: object
        required: [attribute, class]
        additionalProperties: false
        properties:
          attribute: {$ref: '#/$defs/generation'}
          class: {$ref: '#/$defs/generation'}
      contamination:
        type: object
        required: [values, training_contamination]
        additionalProperties: false
        properties:
          values: {type: array, items: {type: [string, number]}}
          training_contamination: {type: [string, number, boolean, 'null']}
      preprocessing:
        type: object
        required: [normalization, dimension_reduction, feature_source, backbone]
        additionalProperties: false
        properties:
          normalization: {type: [string, boolean, 'null']}
          dimension_reduction: {type: [string, boolean, 'null']}
          feature_source: {type: [string, 'null']}
          backbone: {type: [string, 'null']}
      evaluation:
        type: object
        required: [metrics, repetitions, seeds, endpoint]
        additionalProperties: false
        properties:
          metrics: {type: array, minItems: 1, items: {type: string}}
          repetitions: {type: [string, integer, 'null']}
          seeds: {type: [string, integer, array, 'null']}
          endpoint: {type: array, minItems: 1, items: {type: string}}
      data_setting:
        type: object
        required: [dataset_variants, train_split, test_split, normal_only_training]
        additionalProperties: false
        properties:
          dataset_variants: {type: [string, object, array, 'null']}
          train_split: {type: [string, 'null']}
          test_split: {type: [string, 'null']}
          normal_only_training: {type: [string, boolean, 'null']}
      verification:
        type: object
        required: [sources, confidence]
        additionalProperties: false
        properties:
          sources:
            type: array
            items: {type: string, format: uri}
          confidence: {enum: [high, medium, low, unknown]}
  baseline:
    type: object
    required: [roles, core_mechanism, closest_counterfactual, why_compare, why_not_directly_comparable, scalability_candidate, main_datasets, metrics, verification_status, sources]
    additionalProperties: false
    properties:
      roles: {type: array, minItems: 1, items: {type: string}}
      core_mechanism: {type: string}
      closest_counterfactual: {type: string}
      why_compare: {type: string}
      why_not_directly_comparable: {type: string}
      scalability_candidate: {type: boolean}
      main_datasets: {type: array, minItems: 1, items: {type: string}}
      metrics: {type: array, minItems: 1, items: {type: string}}
      verification_status: {enum: [verified, partially_verified, uncertain]}
      sources:
        type: array
        minItems: 1
        items: {type: string, format: uri}
  notes:
    type: [string, 'null']

$defs:
  generation:
    type: object
    required: [mechanism, affected_views, ratio, verified]
    additionalProperties: false
    properties:
      mechanism: {type: [string, 'null']}
      affected_views: {type: [string, integer, array, 'null']}
      ratio: {type: [string, number, array, 'null']}
      verified: {type: boolean}

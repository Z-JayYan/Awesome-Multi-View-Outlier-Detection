$schema: https://json-schema.org/draft/2020-12/schema
title: Awesome-MVOD paper entry
type: object
required:
  - id
  - title
  - year
  - venue
  - venue_type
  - venue_status
  - track
  - status
  - featured
  - tasks
  - mechanisms
  - anomaly_types
  - evidence_levels
  - partial_view
  - datasets
  - summary
  - links
  - code_status
  - link_status
  - verified_from
  - reproducibility
additionalProperties: false
properties:
  id:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]{4}$'
  title:
    type: string
    minLength: 8
  acronym:
    type: [string, 'null']
  authors:
    type: array
    items: {type: string}
  year:
    type: integer
    minimum: 2000
    maximum: 2100
  online_year:
    type: [integer, 'null']
  venue:
    type: string
  venue_type:
    enum: [conference, journal, workshop, preprint, book_chapter]
  venue_status:
    enum: [proceedings, published, accepted, preprint]
  track:
    enum: [core_mvod, partial_mvod, related_natural_multimodal, uncertain]
  status:
    enum: [verified, partially_verified, uncertain]
  featured:
    type: boolean
  tasks:
    type: array
    minItems: 1
    items: {type: string}
  mechanisms:
    type: array
    minItems: 1
    items: {type: string}
  anomaly_types:
    type: array
    minItems: 1
    items: {type: string}
  evidence_levels:
    type: array
    minItems: 1
    items: {type: string}
  representation:
    type: object
    properties:
      learned: {type: boolean}
    required: [learned]
    additionalProperties: false
  partial_view:
    type: boolean
  datasets:
    type: array
    items: {type: string}
  summary:
    type: string
    description: One sentence answering which cross-view signal is used.
  links:
    type: object
    required: [paper, code]
    properties:
      paper: {type: string, format: uri}
      arxiv: {type: [string, 'null'], format: uri}
      code: {type: [string, 'null'], format: uri}
      project: {type: [string, 'null'], format: uri}
      dblp: {type: [string, 'null'], format: uri}
    additionalProperties: false
  code_status:
    enum: [official, third_party, not_found, unknown]
  link_status:
    enum: [verified, unverified]
  verified_from:
    type: array
    minItems: 1
    items:
      type: object
      required: [kind, url]
      properties:
        kind: {enum: [publisher, conference, arxiv, dblp, official_code, author_page]}
        url: {type: string, format: uri}
        facts:
          type: array
          items: {type: string}
      additionalProperties: false
  complexity:
    type: object
    properties:
      reported: {type: [string, 'null']}
      provenance: {enum: [author_claim, derived, unknown]}
      notes: {type: [string, 'null']}
    required: [reported, provenance, notes]
    additionalProperties: false
  reproducibility:
    type: object
    required: [official_code, official_config, dataset_instructions, pretrained_weights, environment, license]
    properties:
      official_code: {enum: [yes, no, partial, unknown]}
      official_config: {enum: [yes, no, partial, unknown]}
      dataset_instructions: {enum: [yes, no, partial, unknown]}
      pretrained_weights: {enum: [yes, no, partial, unknown]}
      environment: {enum: [yes, no, partial, unknown]}
      license: {enum: [yes, no, partial, unknown]}
    additionalProperties: false
  notes:
    type: [string, 'null']

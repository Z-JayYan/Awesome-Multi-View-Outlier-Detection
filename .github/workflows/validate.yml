name: Validate registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/validate_registry.py
      - run: python scripts/generate_tables.py
      - run: python scripts/validate_registry.py
      - name: Ensure generated files are committed
        run: git diff --exit-code
